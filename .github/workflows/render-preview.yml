name: Render Free Preview Docker Smoke Test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/render-preview.yml
      - bootstrap/app.php
      - resources/**
      - tests/Feature/PublicDeploymentAssetTest.php
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/render-preview.yml

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Render PHP Docker image
        run: docker build --progress=plain -t panitia-hub-rt03:render-preview .
      - name: Start disposable PHP preview
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          docker run -d --name rt03-preview -p 10000:10000 \
            -e APP_NAME="PANITIA HUB RT 03" \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_URL=http://127.0.0.1:10000 \
            -e RT03_DEMO_MODE=ephemeral \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/rt03-preview.sqlite \
            -e SESSION_DRIVER=file -e CACHE_STORE=file -e QUEUE_CONNECTION=sync \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            panitia-hub-rt03:render-preview
      - name: Check PHP health and public page
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:10000/up; then
              echo 'Health endpoint ready'
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' rt03-preview | grep -qx true; then
              docker logs rt03-preview
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:10000/up
          curl --fail --silent --show-error --output /tmp/rt03-home.html http://127.0.0.1:10000/
          grep -qi 'Semangat' /tmp/rt03-home.html
      - name: Confirm proxied HTTPS assets and missing-photo fallbacks
        shell: bash
        run: |
          set -euo pipefail
          # Railway terminates HTTPS at its proxy then forwards HTTP to PHP.
          # The generated Vite URLs must retain the browser-facing scheme.
          curl --fail --silent --show-error \
            -H 'Host: panitia-hub-rt03.up.railway.app' \
            -H 'X-Forwarded-Proto: https' \
            -o /tmp/rt03-https.html http://127.0.0.1:10000/
          grep -q 'https://panitia-hub-rt03.up.railway.app/build/assets/' /tmp/rt03-https.html
          if grep -q 'http://panitia-hub-rt03.up.railway.app/build/assets/' /tmp/rt03-https.html; then
            echo "ERROR: Laravel generated mixed-content HTTP Vite assets behind HTTPS."
            exit 1
          fi
          css_path="$(grep -oE '/build/assets/[^" ]+\.css' /tmp/rt03-https.html | head -n 1)"
          js_path="$(grep -oE '/build/assets/[^" ]+\.js' /tmp/rt03-https.html | head -n 1)"
          test -n "$css_path"
          test -n "$js_path"
          curl --fail --silent --show-error -D /tmp/rt03-css-headers \
            -o /tmp/rt03-css "http://127.0.0.1:10000$css_path"
          curl --fail --silent --show-error -D /tmp/rt03-js-headers \
            -o /tmp/rt03-js "http://127.0.0.1:10000$js_path"
          grep -iq 'content-type: text/css' /tmp/rt03-css-headers
          grep -iq 'content-type: text/javascript\|content-type: application/javascript' /tmp/rt03-js-headers
          grep -q 'public-hero' /tmp/rt03-css
          grep -q 'rt03-hero-photo-fallback' /tmp/rt03-https.html
          grep -q 'rt03-neighborhood-photo-fallback' /tmp/rt03-https.html
          echo 'PASS: HTTPS URL generation; CSS/JS served with correct MIME; no missing image tags.'
      - name: Reject unsafe environment before starting the container
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm -e APP_ENV=production -e APP_DEBUG=false \
              -e APP_KEY="base64:$(openssl rand -base64 32)" \
              -e RT03_DEMO_MODE=ephemeral -e DB_CONNECTION=sqlite \
              -e DB_DATABASE=/app/database/database.sqlite panitia-hub-rt03:render-preview; then
            echo 'Unsafe SQLite disk config was accepted'
            exit 1
          fi
      - name: Diagnostics
        if: always()
        run: docker logs rt03-preview || true
